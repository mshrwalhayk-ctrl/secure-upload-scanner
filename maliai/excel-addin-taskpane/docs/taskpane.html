<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساعد المحاسب</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{
  --bg:#ffffff; --bg2:#f6f7f9; --bg3:#eef0f3;
  --fg:#1b1d21; --fg2:#5b6270; --fg3:#8b93a1;
  --line:#e2e5ea; --accent:#107c41; --accent2:#0d6435;
  --user:#e8f3ec; --tool:#f3f4f7; --warn:#b45309; --err:#c0392b;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1b1d21; --bg2:#232629; --bg3:#2b2f33;
    --fg:#eceef1; --fg2:#a8b0bb; --fg3:#7d8593;
    --line:#33383e; --accent:#2ea86a; --accent2:#248c58;
    --user:#22322a; --tool:#26292e; --warn:#e0a458; --err:#ff7b6b;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:"Segoe UI","Segoe UI Arabic",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;
  font-size:13.5px; line-height:1.65;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{opacity:.45;cursor:default}

/* ---------- الترويسة ---------- */
header{
  display:flex;align-items:center;gap:8px;
  padding:9px 11px;border-bottom:1px solid var(--line);background:var(--bg2);flex:0 0 auto;
}
header img{width:22px;height:22px;border-radius:5px}
header .t{font-weight:600;font-size:14px}
header .sp{flex:1}
.chip{
  font-size:10.5px;color:var(--fg2);background:var(--bg3);
  padding:2px 7px;border-radius:999px;white-space:nowrap;
  max-width:120px;overflow:hidden;text-overflow:ellipsis;
}
.iconbtn{
  width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
  color:var(--fg2);font-size:15px;
}
.iconbtn:hover{background:var(--bg3);color:var(--fg)}

/* ---------- أزرار سريعة ---------- */
#quick{
  display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
#quick::-webkit-scrollbar{display:none}
#quick button{
  white-space:nowrap;font-size:12px;padding:5px 11px;border-radius:999px;
  background:var(--bg2);border:1px solid var(--line);color:var(--fg2);
}
#quick button:hover:not(:disabled){background:var(--bg3);color:var(--fg);border-color:var(--fg3)}

/* ---------- سجل المحادثة ---------- */
#log{flex:1 1 auto;overflow-y:auto;padding:12px 11px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:100%;padding:9px 12px;border-radius:var(--radius);white-space:pre-wrap;word-wrap:break-word}
.msg.user{background:var(--user);border:1px solid var(--line);align-self:flex-start;max-width:92%}
.msg.bot{background:var(--bg2);border:1px solid var(--line)}
.msg.err{background:transparent;border:1px solid var(--err);color:var(--err)}
.msg .who{font-size:10.5px;color:var(--fg3);margin-bottom:3px;display:block}

.step{
  display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--fg2);
  background:var(--tool);border:1px solid var(--line);border-radius:8px;padding:5px 9px;
}
.step .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.step.run .dot{background:var(--warn);animation:pulse 1s infinite}
.step.bad .dot{background:var(--err)}
.step code{font-size:10.5px;color:var(--fg3);direction:ltr;unicode-bidi:embed;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.welcome{color:var(--fg2);font-size:12.5px}
.welcome b{color:var(--fg);font-weight:600}
.welcome ul{margin:7px 0 0;padding-inline-start:18px}
.welcome li{margin:3px 0}

/* ---------- التذييل ---------- */
footer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--bg2);padding:8px 10px}
#status{font-size:11px;color:var(--fg2);min-height:16px;margin-bottom:5px}
.inputrow{display:flex;gap:7px;align-items:flex-end}
#input{
  flex:1;resize:none;min-height:56px;max-height:150px;padding:8px 10px;
  border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);
  font-family:inherit;font-size:13.5px;line-height:1.6;
}
#input:focus{outline:none;border-color:var(--accent)}
#send{
  background:var(--accent);color:#fff;border-radius:9px;padding:0 14px;height:38px;
  font-weight:600;font-size:13px;white-space:nowrap;
}
#send:hover:not(:disabled){background:var(--accent2)}
.subrow{display:flex;gap:6px;margin-top:6px;align-items:center}
.subrow button{font-size:11.5px;color:var(--fg2);padding:3px 9px;border-radius:7px;border:1px solid var(--line)}
.subrow button:hover:not(:disabled){background:var(--bg3);color:var(--fg)}
.subrow .sp{flex:1}

/* ---------- الإعدادات ---------- */
#settings{
  position:absolute;inset:0;background:var(--bg);z-index:20;
  display:none;flex-direction:column;overflow:hidden;
}
#settings.open{display:flex}
#settings .body{flex:1;overflow-y:auto;padding:12px 13px}
label.f{display:block;margin:11px 0 4px;font-size:12px;color:var(--fg2)}
input.f,select.f{
  width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg2);color:var(--fg);font-family:inherit;font-size:12.5px;
}
input.f:focus,select.f:focus{outline:none;border-color:var(--accent)}
input.f[dir=ltr]{direction:ltr;text-align:left}
.hint{font-size:11px;color:var(--fg3);margin-top:4px;line-height:1.55}
.rowchk{display:flex;align-items:center;gap:7px;margin:9px 0;font-size:12.5px}
.rowchk input{width:15px;height:15px;accent-color:var(--accent)}
#cfgStatus{font-size:12px;margin-top:11px;min-height:34px;padding:7px 9px;border-radius:8px;background:var(--bg2);border:1px solid var(--line)}
.ok{color:var(--accent)} .bad{color:var(--err)}
#settings footer{display:flex;gap:7px}
#settings footer button{flex:1;padding:9px;border-radius:8px;font-weight:600;font-size:12.5px;border:1px solid var(--line)}
#btnSaveCfg{background:var(--accent);color:#fff;border-color:transparent}
</style>
</head>
<body>

<header>
  <img src="assets/icon-32.png" alt="">
  <span class="t">مساعد المحاسب</span>
  <span class="sp"></span>
  <span class="chip" id="modelChip">—</span>
  <button class="iconbtn" id="btnCfg" title="الإعدادات">⚙</button>
</header>

<div id="quick">
  <button data-q="audit">دقّق الورقة</button>
  <button data-q="audit2">فحص تدقيق شامل</button>
  <button data-q="explain">اشرح الخلية</button>
  <button data-q="stats">ملخص إحصائي</button>
  <button data-q="formula">اكتبلي معادلة</button>
</div>

<div id="log"></div>

<footer>
  <div id="status"></div>
  <div class="inputrow">
    <textarea id="input" placeholder="اكتب طلبك بالعربي…  مثال: اعملي عمود ضريبة ١٦٪ جنب المبلغ"></textarea>
    <button id="send">إرسال</button>
  </div>
  <div class="subrow">
    <button id="btnUndo" disabled>تراجع</button>
    <button id="btnNew">محادثة جديدة</button>
    <span class="sp"></span>
    <span class="chip" id="stepChip" style="display:none"></span>
  </div>
</footer>

<div id="settings">
  <header>
    <span class="t">الإعدادات</span>
    <span class="sp"></span>
    <button class="iconbtn" id="btnCloseCfg" title="رجوع">✕</button>
  </header>
  <div class="body">
    <label class="f">المزوّد</label>
    <select class="f" id="cfgProvider"></select>
    <div class="hint" id="cfgProvHint"></div>

    <label class="f">رابط الخدمة (endpoint)</label>
    <input class="f" id="cfgUrl" dir="ltr" spellcheck="false" placeholder="https://…/v1">
    <div class="hint">العنوان الأساسي بدون <bdi><code>/chat/completions</code></bdi></div>

    <label class="f">مفتاح API</label>
    <input class="f" id="cfgKey" dir="ltr" type="password" spellcheck="false" placeholder="sk-…">
    <div class="hint">بينحفظ على هذا الجهاز بس، وما بينبعت لأي جهة غير الخدمة اللي فوق.</div>

    <label class="f">النموذج</label>
    <input class="f" id="cfgModel" dir="ltr" spellcheck="false" placeholder="glm-5.3-flash">
    <button id="btnModels" style="margin-top:6px;font-size:11.5px;color:var(--fg2);padding:4px 10px;border:1px solid var(--line);border-radius:7px">تحديث قائمة النماذج</button>
    <select class="f" id="cfgModelList" style="margin-top:6px;display:none"></select>

    <label class="f">أقصى عدد خطوات للمهمة الواحدة</label>
    <input class="f" id="cfgSteps" dir="ltr" type="number" min="3" max="40" value="14">

    <div class="rowchk"><input type="checkbox" id="cfgConfirm"><label for="cfgConfirm">اسألني قبل أي تعديل على الشيت</label></div>

    <div id="cfgStatus">—</div>
  </div>
  <footer>
    <button id="btnTest">اختبار الاتصال</button>
    <button id="btnSaveCfg">حفظ</button>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
